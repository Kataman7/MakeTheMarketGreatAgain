<!DOCTYPE html>
<html lang="en" class="no-scroll">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Play - MMGA</title>
  <link rel="icon" href="../public/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.8.0/countUp.umd.min.js"></script>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="h-full bg-[#fdfdfd] flex flex-col items-center justify-between py-6 px-4">
  <a href="../index.html" class="absolute top-4 left-4 text-sm hover:underline">&larr; Retour</a>

  <div id="total" class="text-lg text-center break-all">TOTAL: $0</div>

  <div id="derniere" class="text-8xl sm:text-9xl text-center break-all">$0</div>

  <div class="flex flex-col gap-3 w-full max-w-xs">
    <input id="montant" type="text" inputmode="decimal" placeholder="ex: 100, 50k, 2M, 1B" class="w-full py-3 border-2 border-black text-xl text-center bg-transparent outline-none placeholder-gray-400">
    <button id="btnEnchere" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Bid</button>
    <button id="btnReset" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Reset</button>
  </div>

  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
