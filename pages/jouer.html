<!DOCTYPE html>
<html lang="fr" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jouer - MMGA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      font-family: 'Times New Roman', Times, serif;
      font-weight: bold;
      overflow: hidden;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>
<body class="h-full bg-[#fdfdfd] flex flex-col items-center justify-between py-6 px-4">
  <a href="../index.html" class="absolute top-4 left-4 text-sm hover:underline">&larr; Retour</a>

  <div id="total" class="text-lg text-center break-all">TOTAL: $0</div>

  <div id="derniere" class="text-8xl sm:text-9xl text-center break-all">$0</div>

  <div class="flex flex-col gap-3 w-full max-w-xs">
    <input id="montant" type="number" placeholder="Montant $" class="w-full py-3 border-2 border-black text-xl text-center bg-transparent outline-none placeholder-gray-400">
    <button id="btnEnchere" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Enchère</button>
    <button id="btnReset" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Reset</button>
  </div>

  <script>
    const $total = document.getElementById('total');
    const $derniere = document.getElementById('derniere');

    let total = parseInt(localStorage.getItem('mmga_total')) || 0;
    let derniere = parseInt(localStorage.getItem('mmga_derniere')) || 0;

    const fmt = new Intl.NumberFormat('en-US', {
      style: 'currency', currency: 'USD',
      notation: 'compact', compactDisplay: 'short',
      maximumFractionDigits: 2
    });
    const fmtFull = new Intl.NumberFormat('en-US', {
      style: 'currency', currency: 'USD',
      maximumFractionDigits: 0
    });

    function format(n) {
      return Math.abs(n) >= 1e12 ? fmt.format(n) : fmtFull.format(n);
    }

    function save() {
      localStorage.setItem('mmga_total', total);
      localStorage.setItem('mmga_derniere', derniere);
    }

    function animate(el, from, to, prefix, duration) {
      const start = performance.now();
      const diff = to - from;
      if (diff === 0) { el.textContent = prefix + format(to); return; }
      function tick(now) {
        const t = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        el.textContent = prefix + format(Math.round(from + diff * ease));
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    $total.textContent = 'TOTAL: ' + format(total);
    $derniere.textContent = format(derniere);

    document.getElementById('btnEnchere').addEventListener('click', () => {
      const input = document.getElementById('montant');
      const val = parseInt(input.value);
      if (val < 0 || isNaN(val)) return;
      const prevTotal = total;
      const prevDerniere = derniere;
      total += val;
      derniere = val;
      save();
      animate($total, prevTotal, total, 'TOTAL: ', 400);
      animate($derniere, prevDerniere, derniere, '', 400);
      input.value = '';
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      const prevTotal = total;
      const prevDerniere = derniere;
      total = 0;
      derniere = 0;
      save();
      animate($total, prevTotal, 0, 'TOTAL: ', 400);
      animate($derniere, prevDerniere, 0, '', 400);
    });
  </script>
</body>
</html>
