<!DOCTYPE html>
<html lang="en" class="no-scroll">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Play - MMGA</title>
  <link rel="icon" href="../public/icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.8.0/countUp.umd.min.js"></script>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="h-full bg-[#fdfdfd] flex flex-col items-center justify-between py-6 px-4">
  <div class="w-full flex justify-between items-center">
    <a href="../index.html" class="text-sm hover:underline">&larr; Back</a>
    <a href="history.html" class="text-sm hover:underline uppercase">End Game</a>
  </div>

  <div id="total" class="text-lg text-center break-all">TOTAL: $0</div>

  <div id="last-bid" class="text-8xl sm:text-9xl text-center break-all">$0</div>

  <div id="pending" class="hidden flex flex-col items-center gap-3 w-full max-w-xs">
    <div class="text-lg text-center">PENDING</div>
    <div id="pending-value" class="text-4xl text-center break-all">$0</div>
    <button id="btn-validate" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Validate</button>
    <button id="btn-cancel" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Cancel</button>
  </div>

  <div id="controls" class="flex flex-col gap-3 w-full max-w-xs">
    <input id="amount" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ex: 100, 50k, 2M, -1B" class="w-full py-3 border-2 border-black text-xl text-center bg-transparent outline-none placeholder-gray-400">
    <button id="btn-bid" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Bid</button>
    <button id="btn-reset" class="w-full py-3 border-2 border-black text-xl uppercase hover:bg-black hover:text-[#fdfdfd] transition">Reset</button>
  </div>

  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
